name: Monitor Mercado (Ações + FIIs + Cripto)

on:
  schedule:
    # A cada 1 hora — mais oportunidades ao longo do dia
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full analysis
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "from jobs.daily_analysis import run_analysis; run_analysis(['stocks', 'fiis', 'crypto'])"

      - name: Commit and push tips
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/latest_tips.json data/history.json || true
          if git diff --staged --quiet; then
            echo "Nenhuma mudança para gravar"
          else
            git commit -m "Atualiza dicas Ações/FIIs/Cripto"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
